<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#FAF8F3">
<title>EVARA – Portwise Ventures</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap">
<style>
:root{--bg:#FAF8F3;--card:#FFFFFF;--text:#1F2430;--muted:#6B6F7A;--line:#E6E0D2;--gold:#A5833F;--gold2:#8A6A2B;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;line-height:1.55}
.wrap{max-width:480px;margin:0 auto;padding:20px 16px 44px}
.logo{display:block;width:100%;border-radius:16px;border:1px solid var(--gold);box-shadow:0 10px 26px rgba(31,36,48,.18)}
.logo.sq{max-width:320px;margin:0 auto}
.tag{font:italic 600 17px "Playfair Display",Georgia,serif;color:var(--gold2);text-align:center;margin:20px 0 6px}
h1{font:700 26px "Playfair Display",Georgia,serif;text-align:center;margin:18px 0 0;letter-spacing:.04em}
p{margin:12px 0;font-size:14.5px;color:var(--text)}
.c{text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:14px}
.chips span{border:1px solid var(--gold);border-radius:999px;padding:3px 12px;font-size:12px;color:var(--muted)}
h2{font:600 15px "Playfair Display",Georgia,serif;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin:30px 0 8px;display:flex;align-items:center;gap:10px}
h2::after{content:"";flex:1;height:1px;background:var(--line)}
.hint{color:var(--muted);font-size:12.5px;margin:0 0 12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.t{box-shadow:0 4px 14px rgba(31,36,48,.07);background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;text-decoration:none;color:var(--text);display:flex;flex-direction:column}
.t .lg{aspect-ratio:1/1;overflow:hidden}.t .lg img{width:100%;height:100%;object-fit:contain;display:block}
.t .nm{padding:10px 10px 12px;text-align:center}
.t b{display:block;font:600 13px "Playfair Display",Georgia,serif;letter-spacing:.14em;color:var(--gold2)}
.t small{display:block;color:var(--muted);font-size:11px;margin-top:2px;line-height:1.35}
.t i{display:block;font-style:normal;color:var(--gold);font-size:11px;margin-top:6px}
.btn{box-shadow:0 2px 8px rgba(31,36,48,.05);display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px;text-decoration:none;color:var(--text)}
.btn small{display:block;color:var(--muted);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.btn b{font-size:15px;font-weight:600}.btn span.ar{color:var(--gold2);font-size:20px}
.foot{text-align:center;color:var(--muted);font-size:11.5px;margin-top:30px}
</style>
