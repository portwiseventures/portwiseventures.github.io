# Rebuilds the Trade Intelligence Centre pages whenever intel-content.json (or the generator) changes.
# You can also run it by hand: GitHub > Actions > "Build Trade Intelligence pages" > Run workflow.
name: Build Trade Intelligence pages
on:
  push:
    branches: [main]
    paths: ['intel-content.json', 'tools/build_intel.py']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build pages
        run: python3 tools/build_intel.py
      - name: Commit generated pages
        run: |
          git config user.name "portwise-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Rebuild Trade Intelligence pages"
            git push
          fi
          
